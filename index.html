# <!doctype html>
<html lang="en">
<head>

<style>
:root{--bg:#111014;--panel:#19171e;--panel2:#211e27;--line:#302b38;--text:#f3eff7;--muted:#a9a1b4;--accent:#b9a3ed;--accent2:#d4c7ff;--good:#a8d8bd;--radius:19px;--shadow:0 18px 55px #0005}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(ellipse at 12% -15%,#4d3b642c,transparent 42%),var(--bg)}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;gap:25px;background:#100f13c9}.brand{display:flex;align-items:center;gap:11px;padding:0 9px}.logo{width:37px;height:37px;border-radius:13px;background:linear-gradient(145deg,#d3c5ff,#8c75b7);display:grid;place-items:center;color:#17131f;font-weight:900;font-size:19px;box-shadow:0 5px 22px #b9a3ed22}.brand-name{font-weight:850;letter-spacing:.16em;font-size:16px}.brand-tag{font-size:11px;color:var(--muted);margin-top:1px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#776f82;padding:0 12px;margin-bottom:7px}.nav{display:grid;gap:5px}.nav button,.side-action{border:0;background:transparent;text-align:left;border-radius:12px;padding:11px 12px;color:var(--muted);display:flex;gap:12px;align-items:center;transition:.18s}.nav button:hover,.side-action:hover{background:#ffffff09;color:var(--text)}.nav button.active{background:#b9a3ed1b;color:var(--accent2);box-shadow:inset 2px 0 var(--accent)}.nav .ico{width:19px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;display:grid;gap:7px}.offline-note{border:1px solid var(--line);background:#ffffff04;border-radius:14px;padding:12px;color:var(--muted);font-size:12px}.offline-dot{display:inline-block;width:7px;height:7px;background:var(--good);border-radius:50%;margin-right:7px}.main{min-width:0;padding:27px clamp(17px,4vw,52px) 50px;max-width:1500px;width:100%;margin:0 auto}.topbar{display:flex;gap:14px;align-items:center;margin-bottom:30px}.mobile-brand{display:none}.search-wrap{position:relative;flex:1;max-width:520px}.search-wrap span{position:absolute;left:14px;top:9px;color:var(--muted)}.search{width:100%;border:1px solid var(--line);background:#19171d;border-radius:13px;padding:11px 14px 11px 39px;color:var(--text)}.top-actions{display:flex;gap:8px;margin-left:auto}.btn,.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;transition:transform .16s,border-color .16s,background .16s}.btn:hover,.icon-btn:hover{border-color:#66577f;transform:translateY(-1px)}.btn.primary{background:var(--accent);color:#17121e;border-color:transparent;font-weight:750}.btn.subtle{background:transparent}.icon-btn{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:17px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.15em;font-size:10px;font-weight:800;margin-bottom:8px}.page-head h1{font-size:clamp(27px,4vw,38px);line-height:1.1;letter-spacing:-.045em;margin:0;font-weight:780}.page-head p{margin:9px 0 0;color:var(--muted);max-width:570px}.hero{position:relative;overflow:hidden;border:1px solid #3a3048;background:linear-gradient(115deg,#292333,#1a1820 62%,#25202d);border-radius:25px;padding:clamp(23px,4vw,42px);margin-bottom:29px;min-height:245px;display:flex;align-items:center}.hero:after{content:"";position:absolute;width:280px;height:280px;border:1px solid #c5b0f51c;border-radius:50%;right:4%;top:-35%;box-shadow:0 0 0 35px #c5b0f50a,0 0 0 70px #c5b0f507}.hero-copy{position:relative;z-index:1;max-width:540px}.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.02;letter-spacing:-.055em;margin:0 0 15px}.hero p{color:#c2bacd;max-width:440px;margin:0 0 22px}.hero .tiny{font-size:11px;color:#a89abf;margin-bottom:12px;letter-spacing:.15em;text-transform:uppercase}.hero-mark{position:absolute;right:10%;font-size:clamp(70px,12vw,130px);color:#d8caff1c;transform:rotate(-12deg);font-weight:900;letter-spacing:-.12em}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 14px}.section-head h2{font-size:18px;margin:0;letter-spacing:-.02em}.text-btn{background:transparent;border:0;color:var(--accent2);font-size:13px;padding:6px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.game-card{min-width:0;border:1px solid var(--line);background:linear-gradient(155deg,#1c1a21,#17151a);border-radius:18px;overflow:hidden;transition:transform .18s,border-color .18s;display:flex;flex-direction:column}.game-card:hover{transform:translateY(-3px);border-color:#625475}.cover{height:132px;display:grid;place-items:center;position:relative;overflow:hidden;background:var(--cover,#282333)}.cover:before,.cover:after{content:"";position:absolute;border:1px solid #ffffff1c;border-radius:50%;width:140px;height:140px;right:-30px;top:-65px}.cover:after{width:95px;height:95px;right:25px;top:45px}.cover-symbol{font-size:48px;filter:drop-shadow(0 8px 12px #0004);z-index:1}.pill{position:absolute;z-index:2;left:12px;top:12px;border:1px solid #ffffff22;background:#14111988;backdrop-filter:blur(8px);padding:4px 8px;border-radius:20px;font-size:10px;color:#e8e0f4}.fav{position:absolute;right:11px;top:10px;z-index:3;background:#15121b9c;border:1px solid #ffffff22;border-radius:50%;width:31px;height:31px;display:grid;place-items:center;color:#e7dfff}.fav.on{color:#f1b6d2}.card-body{padding:15px;display:flex;flex-direction:column;gap:8px;flex:1}.card-title{display:flex;justify-content:space-between;gap:7px;align-items:start}.card-title h3{margin:0;font-size:15px}.card-body p{margin:0;color:var(--muted);font-size:12px;min-height:36px}.card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:5px}.category{font-size:11px;color:#a99cb9}.play-small{border:0;border-radius:10px;background:#b9a3ed;color:#17121e;padding:8px 12px;font-size:12px;font-weight:800}.empty{border:1px dashed #443b50;border-radius:17px;padding:30px 18px;text-align:center;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--text);margin-bottom:5px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:19px}.filter{border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:8px 13px;color:var(--muted);font-size:12px}.filter.active{background:#b9a3ed1c;color:var(--accent2);border-color:#65527f}.library-tools{display:flex;gap:9px;flex-wrap:wrap}.player-shell{border:1px solid var(--line);border-radius:19px;overflow:hidden;background:#0c0b0e}.player-top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--line)}.player-top strong{flex:1}.player-frame{width:100%;height:min(66vh,650px);min-height:350px;border:0;background:#101014;display:block}.player-placeholder{min-height:350px;display:grid;place-items:center;padding:20px}.player-placeholder canvas{max-width:100%;touch-action:manipulation}.game-controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:14px}.settings-panel{max-width:650px;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:20px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border:0}.setting-row p{margin:3px 0 0;font-size:12px;color:var(--muted)}.setting-row input[type=color]{width:43px;height:35px;background:transparent;border:0}.setting-row select{background:#25212b;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}.modal-backdrop{position:fixed;inset:0;background:#08070bc9;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:#1b1820;border:1px solid #453a52;border-radius:20px;padding:22px;box-shadow:var(--shadow)}.modal h2{margin:0 0 6px}.modal p{color:var(--muted);font-size:13px}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}.file-drop{border:1px dashed #685a7a;border-radius:15px;padding:24px;text-align:center;background:#b9a3ed08}.file-drop input{max-width:100%;margin-top:14px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#eee7ff;color:#20192b;border-radius:12px;padding:11px 16px;box-shadow:var(--shadow);z-index:50;font-size:13px;font-weight:650;animation:pop .2s ease}.hidden{display:none!important}.footer-note{color:#716a7b;font-size:11px;margin-top:34px}.toggle{accent-color:var(--accent)}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}body.reduce-motion *,body.reduce-motion *:before,body.reduce-motion *:after{animation:none!important;transition:none!important}
/* Optional compact, touch-first layout. */
body.mobile-mode .app{display:block}body.mobile-mode .sidebar{position:fixed;z-index:10;left:0;right:0;bottom:0;top:auto;border-right:0;border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:block;background:#141218f5;backdrop-filter:blur(15px)}body.mobile-mode .brand,body.mobile-mode .nav-label,body.mobile-mode .side-bottom{display:none}body.mobile-mode .nav{display:flex;justify-content:space-around;gap:2px}body.mobile-mode .nav button{flex:1;display:flex;flex-direction:column;gap:2px;justify-content:center;text-align:center;padding:10px 3px;font-size:11px;border-radius:10px;min-height:54px}body.mobile-mode .nav .ico{font-size:20px}body.mobile-mode .main{padding:17px 15px calc(95px + env(safe-area-inset-bottom));max-width:900px}body.mobile-mode .mobile-brand{display:block;font-size:12px;font-weight:850;letter-spacing:.12em;margin-right:3px}body.mobile-mode .topbar{margin-bottom:22px;gap:8px}body.mobile-mode .search-wrap span{left:10px}body.mobile-mode .search{padding:12px 8px 12px 32px;font-size:16px}body.mobile-mode .top-actions .btn{padding:10px;font-size:12px}body.mobile-mode .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}body.mobile-mode .cover{height:110px}body.mobile-mode .card-body{padding:12px;gap:8px}body.mobile-mode .play-small,body.mobile-mode .btn,body.mobile-mode .filter{min-height:40px}body.mobile-mode .player-frame{height:60vh;min-height:320px}body.mobile-mode .player-placeholder{min-height:320px}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app{grid-template-columns:190px minmax(0,1fr)}.sidebar{padding:22px 11px}.main{padding:22px 22px 40px}}
@media(max-width:650px){.app{display:block}.sidebar{position:fixed;z-index:10;left:0;right:0;bottom:0;top:auto;border-right:0;border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:block;background:#141218f5;backdrop-filter:blur(15px)}.brand,.nav-label,.side-bottom{display:none}.nav{display:flex;justify-content:space-around;gap:2px}.nav button{flex:1;display:flex;flex-direction:column;gap:2px;justify-content:center;text-align:center;padding:7px 2px;font-size:10px;border-radius:10px}.nav .ico{font-size:18px}.main{padding:17px 15px calc(90px + env(safe-area-inset-bottom))}.topbar{margin-bottom:22px;gap:8px}.mobile-brand{display:block;font-size:12px;font-weight:850;letter-spacing:.12em;margin-right:3px}.search-wrap span{left:10px}.search{padding:10px 8px 10px 32px;font-size:13px}.top-actions .btn{padding:9px 10px;font-size:12px}.top-actions .icon-btn{width:39px;height:39px}.hero{padding:24px 21px;min-height:240px}.hero-mark{right:3%;top:8%;font-size:78px}.hero h1{font-size:36px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:105px}.cover-symbol{font-size:39px}.card-body{padding:11px;gap:7px}.card-title h3{font-size:13px}.card-body p{font-size:11px;min-height:48px}.play-small{padding:7px 9px}.page-head{align-items:flex-start;flex-direction:column}.player-frame{min-height:320px;height:58vh}.player-placeholder{min-height:320px}}
@media(max-width:370px){.grid{grid-template-columns:1fr}.cover{height:125px}.card-body p{min-height:0}.mobile-brand{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><div class="logo">o.</div><div><div class="brand-name">OFFGRID</div><div class="brand-tag">your little corner of play.</div></div></div>
<div><div class="nav-label">Your space</div><nav class="nav" id="nav">
<button data-page="home" class="active"><span class="ico">⌂</span>Home</button>
<button data-page="explore"><span class="ico">⌕</span>Explore</button>
<button data-page="favorites"><span class="ico">♡</span>Favorites</button>
<button data-page="recent"><span class="ico">◷</span>Recently played</button>
<button data-page="library"><span class="ico">▦</span>My library</button>
</nav></div>
<div class="side-bottom"><button class="side-action" id="sideAdd"><span>＋</span>Add games</button><button class="side-action" id="sideSettings"><span>⚙</span>Settings</button><div class="offline-note"><span class="offline-dot"></span>Made for offline moments<br><span style="padding-left:14px">Your games stay yours.</span></div></div>
</aside>
<main class="main">
<div class="topbar"><div class="mobile-brand">OFFGRID</div><div class="search-wrap"><span>⌕</span><input class="search" id="search" placeholder="Find a little something..." aria-label="Search games"></div><div class="top-actions"><button class="btn subtle" id="addBtn">＋ Add game</button><button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</button></div></div>
<div id="view"></div>
<div class="footer-note">A little play. A little peace. · OFFGRID keeps its built-in games on this page, no connection required.</div>
</main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const BUILTINS=[
{id:'snake',title:'Pocket Snake',desc:'A familiar little classic. Collect dots, grow longer, and try not to bump into yourself.',category:'Arcade',symbol:'〰',cover:'linear-gradient(135deg,#2a3b39,#1a292b)',kind:'snake',source:'built-in'},
{id:'2048',title:'Soft 2048',desc:'Slide matching numbers together and see how high you can climb.',category:'Puzzle',symbol:'▦',cover:'linear-gradient(135deg,#59475e,#2c2338)',kind:'2048',source:'built-in'},
{id:'memory',title:'Memory Garden',desc:'Turn over the cards and find every matching pair at your own pace.',category:'Casual',symbol:'✿',cover:'linear-gradient(135deg,#5a4059,#33243e)',kind:'memory',source:'built-in'},
{id:'ttt',title:'Noughts & Crosses',desc:'A tiny strategy break. Play against a friend on the same screen.',category:'Classics',symbol:'⊞',cover:'linear-gradient(135deg,#3c4563,#22273d)',kind:'ttt',source:'built-in'}
];
const state={page:'home',query:'',category:'All',sort:'Featured',favorites:new Set(),recent:[],imports:[],accent:'#b9a3ed',reduceMotion:false,mobileMode:false,current:null,game:null,modal:null,confirmAction:null};
const safeParse=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};
function load(){state.favorites=new Set(safeParse('offgrid-favs',[]));state.recent=safeParse('offgrid-recent',[]);state.imports=safeParse('offgrid-imports',[]);state.accent=safeParse('offgrid-accent','#b9a3ed');state.reduceMotion=!!safeParse('offgrid-motion',false);state.mobileMode=!!safeParse('offgrid-mobile-mode',false);applySettings()}
function persist(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Browser storage is full or unavailable. Some changes may not persist.');return false}}
function applySettings(){document.documentElement.style.setProperty('--accent',state.accent);document.documentElement.style.setProperty('--accent2',state.accent);document.body.classList.toggle('reduce-motion',state.reduceMotion);document.body.classList.toggle('mobile-mode',state.mobileMode)}
function games(){return [...BUILTINS,...state.imports.map(g=>({...g,source:'imported'}))]}
function gameById(id){return games().find(g=>g.id===id)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const root=$('#toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',2500)}
function setPage(p){stopGame();state.page=p;state.current=null;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function iconFor(g){return g.source==='imported'?'↗':g.symbol}
function card(g){let fav=state.favorites.has(g.id);return `<article class="game-card"><div class="cover" style="--cover:${g.cover||'linear-gradient(135deg,#34303d,#1c1922)'}"><span class="pill">${g.source==='imported'?'Imported':esc(g.category)}</span><button class="fav ${fav?'on':''}" data-fav="${esc(g.id)}" aria-label="${fav?'Remove from':'Add to'} favorites">${fav?'♥':'♡'}</button><div class="cover-symbol">${iconFor(g)}</div></div><div class="card-body"><div class="card-title"><h3>${esc(g.title)}</h3></div><p>${esc(g.desc||'A game in your personal library.')}</p><div class="card-meta"><span class="category">${g.source==='imported'?'Your library':esc(g.category)}</span><button class="play-small" data-play="${esc(g.id)}">Play ↗</button></div></div></article>`}
function cardGrid(list,emptyTitle,emptyText){return list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty"><strong>${esc(emptyTitle)}</strong>${esc(emptyText)}</div>`}
function matching(){let list=games().filter(g=>{let q=state.query.toLowerCase();let match=!q||(g.title+' '+g.desc+' '+g.category).toLowerCase().includes(q);let cat=state.category==='All'||g.category===state.category;return match&&cat});if(state.page==='favorites')list=list.filter(g=>state.favorites.has(g.id));if(state.page==='recent')list=state.recent.map(id=>gameById(id)).filter(Boolean).filter(g=>!state.query||(g.title+' '+g.desc).toLowerCase().includes(state.query.toLowerCase()));if(state.page==='library')list=list.filter(g=>g.source==='imported');if(state.sort==='A–Z')list.sort((a,b)=>a.title.localeCompare(b.title));if(state.sort==='Recently added')list.reverse();return list}
function render(){const v=$('#view');if(state.page==='player'){renderPlayer();return}
if(state.page==='home'){const recent=state.recent.map(gameById).filter(Boolean).slice(0,3);let featured=BUILTINS.slice(0,3);v.innerHTML=`<section class="hero"><div class="hero-copy"><div class="tiny">A quieter kind of gaming space</div><h1>A little play.<br>A little peace.</h1><p>Your own small library of games. No rush, no noise — just pick something and get comfy.</p><button class="btn primary" data-page="explore">Find your next game&nbsp; →</button></div><div class="hero-mark" aria-hidden="true">o.</div></section>${recent.length?`<div class="section-head"><h2>Pick up where you left off</h2><button class="text-btn" data-page="recent">View history →</button></div>${cardGrid(recent,'','')}`:''}<div class="section-head"><h2>A few little favorites</h2><button class="text-btn" data-page="explore">Explore all →</button></div>${cardGrid(featured,'No games yet','Add a game to start your library.')}<div class="section-head"><h2>Your space, your games</h2></div><div class="settings-panel"><div class="setting-row"><div><strong>Bring your own games</strong><p>Import downloaded HTML games from your device.</p></div><button class="btn" id="homeAdd">＋ Add games</button></div><div class="setting-row"><div><strong>Keep it personal</strong><p>Favorites and recent games are saved in this browser when possible.</p></div><button class="btn" id="homeSettings">Settings</button></div></div>`}
else {let titles={explore:['Explore','Find a game for the moment you’re in.'],favorites:['Your favorites','The games you’ve kept close.'],recent:['Recently played','Your latest little adventures, newest first.'],library:['My library','Games you’ve brought into your own space.'],settings:['Settings','Make OFFGRID feel a little more like yours.']};let [title,desc]=titles[state.page]||titles.explore;
if(state.page==='settings'){renderSettings();return}
let list=matching();let cats=['All',...new Set(games().map(g=>g.category))];v.innerHTML=`<div class="page-head"><div><div class="eyebrow">Your little corner</div><h1>${title}</h1><p>${desc}</p></div>${state.page==='library'?'<button class="btn primary" id="libraryAdd">＋ Add games</button>':''}</div>${state.page==='explore'?`<div class="filters">${cats.map(c=>`<button class="filter ${state.category===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}<select id="sort" class="filter" aria-label="Sort games"><option ${state.sort==='Featured'?'selected':''}>Featured</option><option ${state.sort==='A–Z'?'selected':''}>A–Z</option><option ${state.sort==='Recently added'?'selected':''}>Recently added</option></select></div>`:''}${state.page==='library'?'<p style="color:var(--muted);font-size:12px;margin:0 0 18px">Imported files are stored in this browser when storage allows. Only import HTML files you trust.</p>':''}${cardGrid(list,state.page==='favorites'?'No favorites just yet':state.page==='recent'?'Nothing played yet':state.page==='library'?'Your library is waiting':'No games found',state.page==='favorites'?'Tap the heart on a game card to keep it here.':state.page==='recent'?'Play a game and it will show up here.':state.page==='library'?'Add an HTML game from your device to get started.':'Try another search or category.')}${state.page==='library'&&list.length?`<div class="section-head"><h2>Manage imports</h2></div><div class="settings-panel">${list.map(g=>`<div class="setting-row"><div><strong>${esc(g.title)}</strong><p>${(g.html||'').length.toLocaleString()} characters stored · HTML file</p></div><button class="btn" data-remove="${esc(g.id)}">Remove</button></div>`).join('')}</div>`:''}`}
bind(); }
function renderSettings(){const v=$('#view');v.innerHTML=`<div class="page-head"><div><div class="eyebrow">Make yourself at home</div><h1>Settings</h1><p>A few small ways to make this space yours.</p></div></div><div class="settings-panel"><div class="setting-row"><div><strong>Accent color</strong><p>Choose the little highlight used around OFFGRID.</p></div><input type="color" id="accent" value="${esc(state.accent)}" aria-label="Accent color"></div><div class="setting-row"><div><strong>Reduced motion</strong><p>Turn off most animations and transitions.</p></div><input class="toggle" type="checkbox" id="motion" ${state.reduceMotion?'checked':''}></div><div class="setting-row"><div><strong>Mobile-friendly layout</strong><p>Use a compact, touch-first layout with bottom navigation and larger tap targets.</p></div><input class="toggle" type="checkbox" id="mobileMode" ${state.mobileMode?'checked':''}></div><div class="setting-row"><div><strong>Clear recent history</strong><p>Only clears recently played games, not favorites or imports.</p></div><button class="btn" id="clearRecent">Clear history</button></div><div class="setting-row"><div><strong>Remove all imported games</strong><p>Built-in games and favorites remain untouched.</p></div><button class="btn" id="clearImports">Remove imports</button></div><div class="setting-row"><div><strong>Reset appearance</strong><p>Return to OFFGRID’s default accent and motion setting.</p></div><button class="btn" id="resetAppearance">Reset</button></div></div><p style="color:var(--muted);font-size:12px;max-width:650px;margin-top:16px">Storage note: favorites, history, imports, and preferences are saved locally when your browser permits it. Private browsing, storage limits, or clearing browser data may remove them.</p>`;bind()}
function renderPlayer(){const v=$('#view'),g=gameById(state.current);if(!g){state.page='explore';render();return}const isBuilt=g.source!=='imported';v.innerHTML=`<div class="page-head"><div><div class="eyebrow">Now playing</div><h1>${esc(g.title)}</h1><p>${esc(g.desc||'Your game, your pace.')}</p></div><div class="library-tools"><button class="btn" id="playerFav">${state.favorites.has(g.id)?'♥ Favorited':'♡ Favorite'}</button><button class="btn" id="playerBack">← Back</button></div></div><div class="player-shell"><div class="player-top"><strong>${esc(g.title)}</strong><span class="category">${isBuilt?'Built-in game':'Imported HTML'}</span><button class="icon-btn" id="fullscreen" aria-label="Fullscreen">⛶</button></div>${isBuilt?`<div class="player-placeholder" id="gameArea"></div>`:`<iframe class="player-frame" id="importFrame" title="${esc(g.title)}" sandbox="allow-scripts allow-forms allow-pointer-lock" referrerpolicy="no-referrer"></iframe>`}<div class="game-controls" id="gameControls"></div></div>${!isBuilt?'<p style="color:var(--muted);font-size:12px">Imported HTML runs in a restricted frame. Some games that need separate assets, network access, popups, or special browser permissions may not work correctly.</p>':''}`;bind();if(isBuilt)startGame(g);else{const frame=$('#importFrame');try{frame.srcdoc=g.html}catch{toast('Could not launch this imported game.')}}}
function play(id){const g=gameById(id);if(!g)return;stopGame();state.current=id;state.page='player';state.recent=[id,...state.recent.filter(x=>x!==id)].slice(0,30);persist('offgrid-recent',state.recent);$$('#nav button').forEach(b=>b.classList.remove('active'));render()}
function toggleFav(id){if(state.favorites.has(id))state.favorites.delete(id);else state.favorites.add(id);persist('offgrid-favs',[...state.favorites]);render()}
function bind(){ $$('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$$('[data-play]').forEach(b=>b.onclick=()=>play(b.dataset.play));$$('[data-fav]').forEach(b=>b.onclick=()=>toggleFav(b.dataset.fav));$$('[data-cat]').forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;render()});$$('[data-remove]').forEach(b=>b.onclick=()=>confirmModal('Remove this imported game?','This removes the saved copy from OFFGRID. It will not delete the original file on your device.',()=>{state.imports=state.imports.filter(g=>g.id!==b.dataset.remove);persist('offgrid-imports',state.imports);state.recent=state.recent.filter(x=>x!==b.dataset.remove);persist('offgrid-recent',state.recent);render();toast('Imported game removed.')}));const s=$('#sort');if(s)s.onchange=()=>{state.sort=s.value;render()};const homeAdd=$('#homeAdd');if(homeAdd)homeAdd.onclick=showImport;const homeSettings=$('#homeSettings');if(homeSettings)homeSettings.onclick=()=>setPage('settings');const libraryAdd=$('#libraryAdd');if(libraryAdd)libraryAdd.onclick=showImport;const back=$('#playerBack');if(back)back.onclick=()=>setPage('explore');const pf=$('#playerFav');if(pf)pf.onclick=()=>toggleFav(state.current);const full=$('#fullscreen');if(full)full.onclick=()=>{const el=$('#gameArea')||$('#importFrame');if(el&&el.requestFullscreen)el.requestFullscreen().catch(()=>toast('Fullscreen is not available here.'));else toast('Fullscreen is not available in this browser.')};const accent=$('#accent');if(accent)accent.oninput=()=>{state.accent=accent.value;applySettings();persist('offgrid-accent',state.accent)};const motion=$('#motion');if(motion)motion.onchange=()=>{state.reduceMotion=motion.checked;applySettings();persist('offgrid-motion',state.reduceMotion)};const mobileMode=$('#mobileMode');if(mobileMode)mobileMode.onchange=()=>{state.mobileMode=mobileMode.checked;applySettings();persist('offgrid-mobile-mode',state.mobileMode);toast(state.mobileMode?'Mobile-friendly layout enabled.':'Mobile-friendly layout disabled.')};const cr=$('#clearRecent');if(cr)cr.onclick=()=>confirmModal('Clear recent history?','Favorites and imported games will stay as they are.',()=>{state.recent=[];persist('offgrid-recent',[]);render();toast('Recent history cleared.')});const ci=$('#clearImports');if(ci)ci.onclick=()=>confirmModal('Remove all imported games?','This cannot be undone inside OFFGRID. Original files on your device are not deleted.',()=>{state.imports=[];persist('offgrid-imports',[]);state.recent=state.recent.filter(id=>gameById(id));persist('offgrid-recent',state.recent);render();toast('Imported games removed.')});const ra=$('#resetAppearance');if(ra)ra.onclick=()=>{state.accent='#b9a3ed';state.reduceMotion=false;state.mobileMode=false;persist('offgrid-accent',state.accent);persist('offgrid-motion',false);persist('offgrid-mobile-mode',false);applySettings();render();toast('Appearance reset.')}}
function showImport(){const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop" id="modalShade"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="importTitle"><h2 id="importTitle">Bring a game along</h2><p>Choose one or more .html or .htm files from your device. Files are read locally and are not uploaded.</p><div class="file-drop"><div style="font-size:27px;margin-bottom:5px">＋</div><strong>Select HTML game files</strong><br><input type="file" id="fileInput" accept=".html,.htm,text/html" multiple></div><p>Only import files you trust: HTML games can contain JavaScript. This basic importer stores each selected file’s HTML, but does not bundle separate images, audio, or scripts that the game may depend on. Very large files may exceed browser storage limits.</p><div class="modal-actions"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="doImport">Import selected</button></div></section></div>`;$('#cancelModal').onclick=closeModal;$('#modalShade').onclick=e=>{if(e.target.id==='modalShade')closeModal()};$('#doImport').onclick=importFiles}
function closeModal(){$('#modalRoot').innerHTML=''}
function confirmModal(title,desc,action){const root=$('#modalRoot');root.innerHTML=`<div class="modal-backdrop" id="modalShade"><section class="modal" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${esc(desc)}</p><div class="modal-actions"><button class="btn" id="nope">Cancel</button><button class="btn primary" id="yep">Confirm</button></div></section></div>`;$('#nope').onclick=closeModal;$('#yep').onclick=()=>{closeModal();action()};$('#modalShade').onclick=e=>{if(e.target.id==='modalShade')closeModal()}}
async function importFiles(){const input=$('#fileInput');const files=[...(input.files||[])];if(!files.length){toast('Choose at least one HTML file first.');return}let added=0;for(const file of files){if(!/\.html?$/i.test(file.name))continue;if(file.size>3*1024*1024){toast(`${file.name} is over the 3 MB import limit.`);continue}try{const html=await file.text();const id='import-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);const title=file.name.replace(/\.html?$/i,'').replace(/[_-]+/g,' ').trim()||'Imported game';state.imports.push({id,title,desc:'A game you imported from your device.',category:'Imported',symbol:'↗',cover:'linear-gradient(135deg,#554568,#25202d)',html});added++}catch{toast(`Could not read ${file.name}.`)}}if(added){if(!persist('offgrid-imports',state.imports)){state.imports=state.imports.slice(0,-added)}else toast(`${added} game${added===1?'':'s'} imported.`)}closeModal();state.page='library';render()}
function stopGame(){if(state.game&&state.game.stop){try{state.game.stop()}catch{}}state.game=null}
function startGame(g){const area=$('#gameArea'),controls=$('#gameControls');if(!area)return;area.innerHTML='';controls.innerHTML='';if(g.kind==='snake')startSnake(area,controls);if(g.kind==='2048')start2048(area,controls);if(g.kind==='memory')startMemory(area,controls);if(g.kind==='ttt')startTTT(area,controls)}
function startSnake(area,controls){let canvas=document.createElement('canvas');canvas.width=440;canvas.height=440;canvas.style.width='min(100%,440px)';canvas.style.borderRadius='16px';canvas.style.background='#142321';area.append(canvas);let ctx=canvas.getContext('2d'),snake,food,dir,next,score,over,loop;function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];food={x:15,y:10};dir={x:1,y:0};next=dir;score=0;over=false;draw();clearInterval(loop);loop=setInterval(tick,125)}function place(){food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};if(snake.some(p=>p.x===food.x&&p.y===food.y))place()}function tick(){if(over)return;dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=20||h.y>=20||snake.some((p,i)=>i>0&&p.x===h.x&&p.y===h.y)){over=true;draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;place()}else snake.pop();draw()}function draw(){ctx.clearRect(0,0,440,440);ctx.fillStyle='#142321';ctx.fillRect(0,0,440,440);ctx.strokeStyle='#ffffff09';for(let i=0;i<=20;i++){ctx.beginPath();ctx.moveTo(i*22,0);ctx.lineTo(i*22,440);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*22);ctx.lineTo(440,i*22);ctx.stroke()}ctx.fillStyle='#e7b4d6';ctx.beginPath();ctx.arc(food.x*22+11,food.y*22+11,7,0,Math.PI*2);ctx.fill();snake.forEach((p,i)=>{ctx.fillStyle=i?'#79bca3':'#c1eadb';ctx.beginPath();ctx.roundRect(p.x*22+2,p.y*22+2,18,18,5);ctx.fill()});ctx.fillStyle='#e8f3ef';ctx.font='bold 15px system-ui';ctx.fillText('SCORE  '+score,12,23);if(over){ctx.fillStyle='#0b1715cc';ctx.fillRect(0,0,440,440);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 28px system-ui';ctx.fillText('Nice try!',220,205);ctx.font='16px system-ui';ctx.fillText('Score: '+score,220,234);ctx.textAlign='left'}}function key(e){let m={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0}}[e.key];if(m){e.preventDefault();if(m.x!==-dir.x||m.y!==-dir.y)next=m}}document.addEventListener('keydown',key);let startX=0,startY=0;canvas.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<12)return;let m=Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)};if(m.x!==-dir.x||m.y!==-dir.y)next=m},{passive:true});controls.innerHTML='<span class="category">Use arrow keys / WASD or swipe · Avoid the edges</span><button class="btn" id="restartGame">Restart</button>';$('#restartGame').onclick=reset;reset();state.game={stop:()=>{clearInterval(loop);document.removeEventListener('keydown',key)}}}
function start2048(area,controls){let board,score,over;const wrap=document.createElement('div');wrap.style.cssText='width:min(100%,420px);padding:13px;border-radius:18px;background:#4a3d51';const scoreEl=document.createElement('div');scoreEl.style.cssText='color:#f8f0ff;font-weight:800;margin:3px 0 12px';const grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(4,1fr);gap:8px';wrap.append(scoreEl,grid);area.append(wrap);function reset(){board=Array(16).fill(0);score=0;over=false;add();add();draw()}function add(){let e=board.map((v,i)=>v===0?i:-1).filter(i=>i>=0);if(e.length)board[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4}function draw(){scoreEl.textContent='SCORE  '+score;grid.innerHTML=board.map(v=>`<div style="aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:${({0:'#342b3b',2:'#eee5f1',4:'#d8c5ed',8:'#bca1de',16:'#a789cf',32:'#936dbd',64:'#7d5ba7',128:'#d6b7a0',256:'#d7a78c',512:'#d28eac',1024:'#bda5df',2048:'#e8d3a0'})[v]||'#d3c2e5'};color:${v>=8?'#fff':v===0?'#342b3b':'#382d43'};font-size:clamp(17px,4vw,27px);font-weight:850">${v||''}</div>`).join('')}function move(d){if(over)return;let old=board.join(',');for(let n=0;n<4;n++){let ids=Array.from({length:4},(_,i)=>d==='left'?n*4+i:d==='right'?n*4+3-i:d==='up'?i*4+n:(3-i)*4+n);let vals=ids.map(i=>board[i]).filter(Boolean),out=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){out.push(vals[i]*2);score+=vals[i]*2;i++}else out.push(vals[i])}while(out.length<4)out.push(0);ids.forEach((id,i)=>board[id]=out[i])}if(old!==board.join(',')){add();draw();if(board.includes(2048))toast('2048! You did it.')}}function key(e){let d={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'}[e.key];if(d){e.preventDefault();move(d)}}document.addEventListener('keydown',key);controls.innerHTML='<span class="category">Arrow keys / WASD · Swipe on touch screens</span><button class="btn" id="restartGame">Restart</button>';$('#restartGame').onclick=reset;let sx=0,sy=0;wrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});wrap.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>20)move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});reset();state.game={stop:()=>document.removeEventListener('keydown',key)}}
function startMemory(area,controls){let icons=['✿','☾','✦','☁','♢','♡','☼','❋'];let deck,chosen,matched,moves,lock;let wrap=document.createElement('div');wrap.style.cssText='width:min(100%,430px)';let info=document.createElement('div');info.style.cssText='margin-bottom:12px;color:#cfc4df;font-weight:700';let grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px';wrap.append(info,grid);area.append(wrap);function reset(){deck=[...icons,...icons].sort(()=>Math.random()-.5);chosen=[];matched=new Set();moves=0;lock=false;draw()}function draw(){info.textContent=`${moves} turns · ${matched.size/2} / ${icons.length} pairs`;grid.innerHTML=deck.map((x,i)=>`<button data-card="${i}" style="aspect-ratio:1;border:1px solid #574765;border-radius:12px;background:${matched.has(i)||chosen.includes(i)?'#b9a3ed':'#282330'};color:${matched.has(i)||chosen.includes(i)?'#21192b':'#9e90b5'};font-size:clamp(22px,5vw,35px);font-weight:800">${matched.has(i)||chosen.includes(i)?x:'?'}</button>`).join('');$$('[data-card]').forEach(b=>b.onclick=()=>flip(+b.dataset.card))}function flip(i){if(lock||matched.has(i)||chosen.includes(i))return;chosen.push(i);draw();if(chosen.length===2){moves++;if(deck[chosen[0]]===deck[chosen[1]]){chosen.forEach(i=>matched.add(i));chosen=[];draw();if(matched.size===deck.length)toast('Every pair found. Lovely!')}else{lock=true;setTimeout(()=>{chosen=[];lock=false;draw()},650)}}}controls.innerHTML='<span class="category">Find all the matching pairs</span><button class="btn" id="restartGame">Shuffle & restart</button>';$('#restartGame').onclick=reset;reset();state.game={stop:()=>{}}}
function startTTT(area,controls){let board,turn,done;const wrap=document.createElement('div');wrap.style.cssText='width:min(100%,360px)';const status=document.createElement('div');status.style.cssText='text-align:center;font-weight:750;margin-bottom:14px;color:#d6c8ef';const grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:9px';wrap.append(status,grid);area.append(wrap);function reset(){board=Array(9).fill('');turn='X';done=false;draw()}function winner(){for(let [a,b,c] of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(board[a]&&board[a]===board[b]&&board[a]===board[c])return board[a];return board.every(Boolean)?'draw':null}function draw(){let w=winner();if(w)done=true;status.textContent=w?(w==='draw'?'A little draw. Play again?':w+' wins!'):`${turn}'s turn`;grid.innerHTML=board.map((v,i)=>`<button data-cell="${i}" style="aspect-ratio:1;border:1px solid #484056;border-radius:14px;background:#25212d;color:${v==='X'?'#d5c4ff':'#eabdd8'};font-size:clamp(36px,8vw,54px);font-weight:800">${v}</button>`).join('');$$('[data-cell]').forEach(b=>b.onclick=()=>{let i=+b.dataset.cell;if(done||board[i])return;board[i]=turn;turn=turn==='X'?'O':'X';draw()})}controls.innerHTML='<span class="category">Two players · same screen</span><button class="btn" id="restartGame">Play again</button>';$('#restartGame').onclick=reset;reset();state.game={stop:()=>{}}}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});$('#search').addEventListener('input',e=>{state.query=e.target.value;if(state.page==='player')return;const pos=e.target.selectionStart;render();const input=$('#search');if(input){input.value=state.query;input.focus();try{input.setSelectionRange(pos,pos)}catch{}}});$('#addBtn').onclick=showImport;$('#sideAdd').onclick=showImport;$('#settingsBtn').onclick=()=>setPage('settings');$('#sideSettings').onclick=()=>setPage('settings');
load();render();
})();
